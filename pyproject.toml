[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sigmaepsilon.solid.material"
version = "1.1.0"
description = "Material models for solid structures in Python."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" }]
maintainers = [{ name = "Bence Balogh", email = "bencebalogh@sigmaepsilon.com" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
keywords = [
    "engineering", "mechanics", "solid mechanics", "Python",
    "numerical methods", "material models", "material properties",
    "material testing", "material characterization", "material science",
]
dependencies = [
    "sigmaepsilon-core>=1.3.0",
    "sigmaepsilon-math>=2.6.0",
    "sigmaepsilon-mesh>=3.3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.57",
    "sympy>=1.9",
    "xarray>=2023.1.0",
]

[project.urls]
Homepage = "https://github.com/sigma-epsilon/sigmaepsilon.solid.material"
Repository = "https://github.com/sigma-epsilon/sigmaepsilon.solid.material"
Documentation = "https://sigmaepsilonsolidmaterial.readthedocs.io/en/latest/"

[tool.hatch.build.targets.wheel]
packages = ["src/sigmaepsilon"]

[tool.hatch.build.targets.sdist]
include = ["src/sigmaepsilon", "README.md", "LICENSE"]

[tool.uv]
# Install groups explicitly (`uv sync --group <name>`), as in the other sigmaepsilon packages.
default-groups = []
# Lock-only constraint, it does not end up in the package metadata. The Linux wheels
# of cytriangle>=2 need glibc 2.39, which Ubuntu 22.04 (CircleCI) lacks.
constraint-dependencies = ["cytriangle<2; sys_platform == 'linux'"]

[dependency-groups]
dev = [
    "matplotlib>=3.8.3",
    "texttable>=1.7.0",
    "pandas>=2.2.0",
    "ipykernel>=6.29.2",
    "pyyaml>=6.0.1",
    "black>=24.2.0",
]
test = [
    "coverage>=7.4.1",
    "pytest>=8.0.1",
    "pytest-cov>=4.1.0",
    "pyyaml>=6.0.1",
]
docs = [
    "ipython>=8.21.0,<9",
    "myst-parser>=2.0.0,<3",
    "nbsphinx>=0.9.3,<0.10",
    "sphinx-gallery>=0.15.0,<0.16",
    "sphinx-copybutton>=0.5.2,<0.6",
    "sphinxcontrib-bibtex>=2.6.2,<3",
    "nbsphinx-link>=1.3.0,<2",
    "sphinxcontrib-svg2pdfconverter>=1.2.2,<2",
    "sphinx-design>=0.5.0,<0.6",
    "sphinx-inline-tabs>=2023.4.21,<2024",
    "pydata-sphinx-theme>=0.15.2,<0.16",
    "matplotlib>=3.8.3,<4",
    "setuptools>=65.5.1",
    "numpy>=1.22.2",
    "pillow>=10.0.1",
    "tornado>=6.3.3",
    "fonttools>=4.43.0",
]
